unbind C-b
# set-option -g default-shell  "/usr/bin/zsh"
set -g default-shell  "/usr/sbin/bash"
set -g default-command "/usr/sbin/fish"
set-option -g detach-on-destroy off
set-option -g prefix C-a
set-option -g focus-event on
#set-option -g prefix C-m
set-option -sg escape-time 10
#set-option -g repeat-time 1
set -g allow-rename on
set -g automatic-rename on

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


bind-key C-a send-prefix
#split panes
bind | split-window -h
bind - split-window -v
#bind-key -r -T prefix h select-pane -L
#bind-key -r -T prefix j select-pane -D
#bind-key -r -T prefix k select-pane -U
#bind-key -r -T prefix l select-pane -R
bind-key -T prefix a copy
bind-key  -T prefix h select-pane -L
bind-key  -T prefix j select-pane -D
bind-key  -T prefix k select-pane -U
bind-key  -T prefix l select-pane -R
bind-key  -T prefix C-h previous-window
bind-key  -T prefix C-l next-window
bind-key  -T prefix C-j switch-client -n\; refresh-client -S
bind-key  -T prefix C-k switch-client -p\; refresh-client -S
bind-key  -T prefix ";" resize-pane -Z

bind-key -T prefix C-[ copy-mode
bind-key -T prefix C-] pasteb

bind-key '!' command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key '@' command-prompt -p "send pane to:" "join-pane -t '%%'"
unbind '"'
unbind %
#unbind z

#reload config
bind-key r source ~/.tmux.conf
# bind-key -r s run-shell "tmux neww switch_session_fzf.sh"
bind-key -r s run-shell "tmux neww ~/.local/bin/tmux-session-switcher"
#"display-popup -E "tmux switch-client -t \"$(tmux ls | cut -d \":\" -f 1 | fzf)\""
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# setw -g window-status-current-style bg=colour237

set -g default-terminal "tmux-256color"
#set-option -sa terminal-overrides 'alacritty:RGB'
# set -ga terminal-overrides ",xterm-256color*:Tc"
set -ga terminal-overrides ",xterm-256color:RGB"
#set -sa terminal-overrides ",xterm*:Tc"

#set window and pane colors
#set-option -g pane-active-border-bg blue
#set -g window-style 'bg=colour136' #'fg=colour247,bg=colour236'


#set -g window-active-style 'bg=colour252' #'fg=colour250,bg=black'
#set -g pane-border-style 'fg=colour238,bg=colour236'
#set -g pane-active-border-style 'fg=colour51,bg=colour236'
#set -g pane-active-border-fg colour51

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmp'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin '2kabhishek/tmux2k'
#set -g @themepack 'powerline/default/yellow'
#set -g @themepack 'powerline/double/yellow'
# set -g @themepack 'powerline/block/cyan'
set -g @tmux2k-theme 'onedark'
set -g @plugin 'laktak/extrakto'

bind-key M-g display-popup -E "htop"
#bind M-f split-window -h "yazi" 
bind M-f display-popup -E "yazi" 
bind-key M-e display-popup -E "tmux new-session  -A -s scratch"

bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5
bind -r M-h resize-pane -L 5

run -b '~/.tmux/plugins/tpm/tpm'
#run '~/.tmux/plugins/tpm/tpm'
