# More option see https://github.com/DreamMaoMao/mango/wiki/
syncobj_enable=1
# Window effect
# allow_tearing=1 
# windowrule=force_tearing:1,app-id:org.qutebrowser.qutebrowser

blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
# ov_tab_mode=o
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=1


# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=8
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
focuscolor=0xffb890ff
focuscolor=0xffffffff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff


# monitor
monitorrule=name:eDP-1,scale:1.2
# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

bind=NONE,Print,spawn_shell, DATE="$(date)" && grim -g "$(slurp)" "/home/zanshin/screenshots/$DATE.png" && feh "/home/zanshin/screenshots/$DATE.png"
# bind=SUPER,z,toggleview,1,2
bind=Super,p,setlayout,grid
# bind=Super,v,setlayout,deck
# windowrule=isnamedscratchpad:1,width:2860,height:800,offsetx:-100,offsety:-100,title:dropdown
# windowrule=isnamedscratchpad:1,isoverlay:1,width:2860,height:800,offsety:-100,appid:dropdown
# bind=SUPER,space,toggle_named_scratchpad,dropdown,none,kitty --app-id=dropdown tmux 
#
# KITTY
# windowrule=isnamedscratchpad:1,width:2320,height:800,offsetx:0,offsety:-100,title:dropdown
# bind=SUPER,space,toggle_named_scratchpad,none,dropdown,kitty -T dropdown 

# WEZTERM
# windowrule=isnmedscratchpad:1,isoverlay,width:2860,height:800,offsety:-100,appid:dropdown
# bind=SUPER,space,toggle_named_scratchpad,dropdown,none,wezterm start --class dropdown
#
# GHOSTTY
windowrule=isnamedscratchpad:1,isoverlay,width:1460,height:600,offsetx:0,offsety:-100,title:dropdown
# windowrule=isnamedscratchpad:1,isoverlay,width:2860,height:800,offsetx:0,offsety:-100,appid:dropdown
# bind=SUPER,space,toggle_named_scratchpad,none,dropdown,ghostty --title=dropdown -e zellij #zellij-session-switcher
# bind=SUPER,c,toggle_named_scratchpad,none,dropdown,ghostty --title=dropdown -e zellij #zellij-session-switcher
bind=SUPER,c,toggle_named_scratchpad,none,dropdown,ghostty --title=dropdown -e zellij-session-switcher
# windowrule=isnamedscratchpad:1,isoverlay:1,width:2860,height:800,offsety:-100,appid:dropdown
# bind=SUPER,space,toggle_named_scratchpad,dropdown,none,kitty --app-id=dropdown tmux 

#bind=MOD,KEY,toggle_named_scratchpad,appid,title,command

# bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bind=None,XF86MonBrightnessUp,spawn, brightnessctl --class=backlight set +5%
bind=NONE,XF86MonBrightnessDown,spawn, brightnessctl --class=backlight set 5%-

bind=SUPER,b,spawn_shell,pkill swaybg;swaybg -m stretch -i "$(find ~/wallpapers2/ -type f | shuf -n 1)"
# reload config
bind=SUPER,r,reload_config
# bind=SUPER,space, toggle_scratchpad
# bind=SUPER,p,view,0
# menu and terminal
# bind=SUPER,d,spawn,rofi -show drun           

# bind=SUPER,d,spawn,wofi --show drun
bind=SUPER,d,spawn, fuzzel -D auto
bind=SUPER,Return,spawn,kitty

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus
#bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
# bind=SUPER,Tab,toggleoverview,
ov_tab_mode=1
bind=SUPER,o,toggleoverview,1

bind=ALT,backslash,togglefloating,
bind=SUPER,f,togglemaximizescreen,
# bind=SUPER,f,togglefullscreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,

bind=SUPER,a,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=SUPER,x,set_proportion,1.0
bind=SUPER,e,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout
bind=SUPER,s,setlayout,scroller
bind=SUPER,w,setlayout,tile
bind=SUPER,v,setlayout,vertical_tile

# tag switch
bind=SUPER+ALT,h,viewtoleft,0
bind=SUPER+ALT,l,viewtoright,0
# bind=CTRL,Left,viewtoleft_have_client,0
# bind=CTRL,Right,viewtoright_have_client,0
bind=SUPER+SHIFT,h,tagtoleft,0
bind=SUPER+SHIFT,l,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# Mouse Button Binding
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=noblur:1,layer_name:selection
# exec 
exec-once=waybar -c ~/.config/waybar/config-mango.jsonc
