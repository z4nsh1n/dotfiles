# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=,preferred,auto,1

xwayland {
enabled = true
force_zero_scaling = true
# create_abstract_socket = true
}
###################
###   Launch    ###
###################

#exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
#exec-once = dbus-update-activation-environment --systemd --all # for XDPH
#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = wl-paste --type text --watch cliphist store # clipboard store text data
exec-once = wl-paste --type image --watch cliphist store # clipboard store image data

###################
###     Env     ###
###################
env = PATH,$PATH:$scrPath
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_USE_XINPUT2,1
# env = GDK_SCALE,2
env = SDL_VIDEODRIVER,wayland,x11

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# env = QT_AUTO_SCREEN_SCALE_FACTOR,2

plugins {
}
###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
# $terminal = foot
# $terminal = kitty
# $terminal = wezterm-gui
# $menu = wofi --show drun
$menu = fuzzel -D no 


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar
exec-once = nm-applet

bind = ALT,Tab, exec, "/home/zanshin/.config/hypr/hyprland_list_windows.sh"
bind = SUPER, code:48, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')

bind = SUPER, code:47, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

bind = alt, space, exec, $(hyprctl activewindow -j | jq '.floating') && hyprctl dispatch cyclenext tiled || hyprctl dispatch cyclenext floating

bind=SUPER,E,exec,[workspace special silent;float ;move 1 1; size monitor_w*0.99 monitor_h*0.4] $terminal --class=dropdown
# bind=SUPER,E,exec,[workspace special silent;float ;move 1 1; size monitor_w*0.99 monitor_h*0.4] $terminal --class dropdown -e tmux attach
bind=SUPER,A,exec,[workspace special:filemanager silent;float;move 0 0; size monitor_w*0.5 monitor_h*0.5]$terminal --class=yazi -e yazi
#WEZTERM
# bind=SUPER,E,exec,[workspace special silent;float ;move 1 1; size monitor_w*0.99 monitor_h*0.4] $terminal start --class dropdown tmux attach
# bind=SUPER,A,exec,[workspace special:filemanager silent;float;move 0 0; size monitor_w*0.5 monitor_h*0.5]$terminal start --class yazi yazi

bind=SUPER,n,layoutmsg, orientationnext
bind=SUPER,Tab, layoutmsg, rollnext 
# bind=SUPER,Tab, movefocus, left
# bind=SUPER,Tab, bringactivetotop
bind=SUPER SHIFT ,Tab , layoutmsg, rollprev
bind=SUPER SHIFT ,Tab, movefocus, left
#bind=SUPER SHIFT, h, layoutmsg, swapwithmaster
bind=SUPER SHIFT, h, swapwindow,l
bind=SUPER SHIFT, l, swapwindow, r
bind=SUPER SHIFT, j, swapwindow, d
bind=SUPER SHIFT, k, swapwindow, u

bind=SUPER,Down, layoutmsg, orientationbottom
bind=SUPER,Left, layoutmsg, orientationleft
bind=SUPER,Right, layoutmsg, orientationright
bind=SUPER,Up, layoutmsg, orientationtop
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 15 #21

    border_size = 8

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    # layout = dwindle
    layout = master
    # layout = scrolling
}
workspace = 1, layoutopt:togglesplit:true
workspace = 6, layoutopt:direction:right
bind = Super, period, layoutmsg, move +col 
bind = Super, comma, layoutmsg, swapcol l
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = .7

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    # animation = hyprfocusIn, 1, 1.7, easeInOutCubic
    # animation = hyprfocusOut, 1, 1.7, easeInOutCubic
    # animation = hyprfocusOut, 1, 1.7, almostLinear
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
    new_on_top = true

    orientation = "bottom"
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    # kb_options = ctrl:nocaps
    kb_rules =
    
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    force_no_accel = 0


    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    # workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod Shift, V, exec, hyprctl keyword workspace ",layoutopt:orientation:top" #togglefloating,
bind = $mainMod , V, exec, hyprctl keyword workspace ",layoutopt:orientation:left" #togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, exec, hyprctl keyword workspace ",layout:scrolling" #togglefloating,
bind = $mainMod SHIFT, S, exec, hyprctl keyword workspace ",layout:master" #togglefloating,
# bind = $mainMod, S, togglespecialworkspace, filemanager
bind = SUPER, c, togglespecialworkspace
bind = SUPER, SPACE, togglespecialworkspace
bind = $mainMod, F, fullscreen
bind= $mainMod,B,exec, pkill swaybg;swaybg -m stretch -i "$(find ~/wallpapers -type f | shuf -n 1)"
bind=,Print,exec, DATE="$(date)" && grim -g "$(slurp)" "/tmp/$DATE.png" && feh "/tmp/$DATE.png"

bind=SUPERCONTROL,h,resizeactive, -39 0
bind=SUPERCONTROL,l,resizeactive, 40 0
bind=SUPERCONTROL,k,resizeactive, 1 -40
bind=SUPERCONTROL,j,resizeactive, 0 40
bind=$mainMod,t,togglegroup
bind=$mainMod,a,changegroupactive,b
# bind=$mainMod,s,changegroupactive,f
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind= ,XF86AudioRaiseVolume,exec, pactl set-sink-volume alsa_output.pci-0000_00_1f.3.analog-stereo +5%
bind= ,XF86AudioLowerVolume,exec, pactl set-sink-volume alsa_output.pci-0000_00_1f.3.analog-stereo -5%
bonf= ,XF86AudioMute,exec, pactl set-sink-mute alsa_output.pci-0000_00_1f.3.analog-stereo toggle
bind=SUPERALT,h,workspace, e-1
bind=SUPERALT,l,workspace, e+1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 1%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 1%-
#bindel = ,XF86MonBrightnessUp, exec, xbacklight -dec 2 
#bindel = ,XF86MonBrightnessDown, exec, xbacklight -inc 2

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

#mExample windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev = suppress_event maximize, class:.*

# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


windowrule=float true, match:title ^(dropdown)$
windowrule=float true, match:class ^(dropdown)$
windowrule=workspace special silent,match:title ^(dropdown)$
windowrule=workspace special silent,match:class ^(dropdown)$ 
windowrule=size 100% 30%, match:class ^(dropdown)
windowrule=size 100% 30%, match:title ^(dropdown)
windowrule=move 0 0, match:class ^(dropdown)
windowrule=move 0 0, match:title ^(dropdown)

windowrule=match:float true, match:title .*dropdown.*
windowrule=match:float true, match:class .*dropdown.*
windowrule=workspace special silent,match:title .*dropdown.*
windowrule=workspace special silent,match:class .*dropdown.*
windowrule=size 100% 30%, match:class .*dropdown.*
windowrule=size 100% 30%, match:title .*dropdown.*
windowrule=move 0 0, match:class .*dropdown.*
windowrule=move 0 0, match:title .*dropdown.*

